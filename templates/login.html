{% extends 'base.html' %}

{% block title %}Login - Kitui Housing{% endblock %}

{% block extra_css %}
<style>
    .auth-card {
        border: none;
        box-shadow: 0 4px 15px rgba(26, 77, 71, 0.1);
    }
    .auth-card .card-body {
        padding: 2.5rem;
    }
    @media (max-width: 768px) {
        .auth-card .card-body {
            padding: 1.5rem;
        }
        .container.my-5 {
            margin-top: 1.5rem !important;
            margin-bottom: 1.5rem !important;
        }
    }
    .form-label {
        color: #1a4d47;
        font-weight: 600;
        margin-bottom: 8px;
    }
    .form-control {
        border: 2px solid #e8eff0;
        padding: 10px 15px;
    }
    .form-control:focus {
        border-color: #1a4d47;
        box-shadow: 0 0 0 0.2rem rgba(26, 77, 71, 0.15);
    }
    .btn-login {
        background-color: #1a4d47;
        border: none;
        font-weight: 600;
    }
    .btn-login:hover {
        background-color: #0f3330;
    }
    .auth-link {
        color: #1a4d47;
        text-decoration: none;
        font-weight: 600;
    }
    .auth-link:hover {
        color: #0f3330;
        text-decoration: underline;
    }
    .password-toggle-wrapper {
        position: relative;
    }
    .password-toggle-icon {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        color: #6c757d;
        z-index: 10;
        background: transparent;
        border: none;
        padding: 5px;
    }
    .password-toggle-icon:hover {
        color: #1a4d47;
    }
    .password-toggle-wrapper .form-control {
        padding-right: 45px;
    }
</style>
{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card auth-card">
                <div class="card-body">
                    <h2 class="card-title text-center mb-4" style="color: #1a4d47;"><i class="fas fa-sign-in-alt me-2"></i>Login</h2>
                    
                    <form method="POST" action="{{ url_for('login') }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                        <div class="mb-3">
                            <label for="username" class="form-label"><i class="fas fa-user me-2"></i>Username or Email</label>
                            <input type="text" class="form-control" id="username" name="username" required autofocus placeholder="Enter username or email">
                        </div>
                        
                        <div class="mb-4">
                            <label for="password" class="form-label"><i class="fas fa-lock me-2"></i>Password</label>
                            <div class="password-toggle-wrapper">
                                <input type="password" class="form-control" id="password" name="password" required>
                                <button type="button" class="password-toggle-icon" onclick="togglePassword('password')">
                                    <i class="fas fa-eye" id="toggle-password-icon"></i>
                                </button>
                            </div>
                        </div>
                        
                        <div class="d-grid">
                            <button type="submit" class="btn btn-login btn-lg text-white">Login</button>
                        </div>
                    </form>
                    
                    <div class="text-center mt-4">
                        <p class="mb-2">
                            <small>
                                <a href="{{ url_for('forgot_password') }}" class="auth-link">Forgot Password?</a>
                            </small>
                        </p>
                        <p class="mb-2">
                            <small class="text-muted">
                                Don't have an account? 
                                <a href="{{ url_for('signup') }}" class="auth-link">Sign up</a>
                            </small>
                        </p>
                        <p class="mb-0">
                            <small>
                                <a href="{{ url_for('dashboard') }}" class="auth-link"><i class="fas fa-arrow-left me-1"></i>Back to Dashboard</a>
                            </small>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function togglePassword(inputId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById('toggle-' + inputId + '-icon');
    
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
    }
}
</script>
{% endblock %}
