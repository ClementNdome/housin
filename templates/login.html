{% extends 'base.html' %}

{% block title %}Login - Kitui Housing{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-body p-5">
                    <h2 class="card-title text-center mb-4">Login</h2>
                    
                    <form method="POST" action="{{ url_for('login') }}">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" name="username" required autofocus>
                        </div>
                        
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">Login</button>
                        </div>
                    </form>
                    
                    <div class="text-center mt-3">
                        <p class="mb-2">
                            <small class="text-muted">
                                <a href="{{ url_for('forgot_password') }}" class="text-decoration-none">Forgot Password?</a>
                            </small>
                        </p>
                        <p class="mb-2">
                            <small class="text-muted">
                                Don't have an account? 
                                <a href="{{ url_for('signup') }}" class="text-decoration-none">Sign up</a>
                            </small>
                        </p>
                        <p class="mb-0">
                            <small class="text-muted">
                                <a href="{{ url_for('dashboard') }}" class="text-decoration-none">← Back to Dashboard</a>
                            </small>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
