{% extends 'base.html' %}

{% block title %}Reset Password - Kitui Housing{% endblock %}

{% block extra_css %}
<style>
    .auth-card {
        border: none;
        box-shadow: 0 4px 15px rgba(26, 77, 71, 0.1);
    }
    .auth-card .card-body {
        padding: 2.5rem;
    }
    .form-label {
        color: #1a4d47;
        font-weight: 600;
        margin-bottom: 8px;
    }
    .form-control {
        border: 2px solid #e8eff0;
        padding: 10px 15px;
    }
    .form-control:focus {
        border-color: #1a4d47;
        box-shadow: 0 0 0 0.2rem rgba(26, 77, 71, 0.15);
    }
    .btn-reset {
        background-color: #1a4d47;
        border: none;
        font-weight: 600;
    }
    .btn-reset:hover {
        background-color: #0f3330;
    }
    .auth-link {
        color: #1a4d47;
        text-decoration: none;
        font-weight: 600;
    }
    .auth-link:hover {
        color: #0f3330;
        text-decoration: underline;
    }
    .password-toggle-wrapper {
        position: relative;
    }
    .password-toggle-icon {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        color: #6c757d;
        z-index: 10;
        background: transparent;
        border: none;
        padding: 5px;
    }
    .password-toggle-icon:hover {
        color: #1a4d47;
    }
    .password-toggle-wrapper .form-control {
        padding-right: 45px;
    }
</style>
{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card auth-card">
                <div class="card-body">
                    <h2 class="card-title text-center mb-4" style="color: #1a4d47;"><i class="fas fa-key me-2"></i>Reset Password</h2>
                    <p class="text-center text-muted mb-4">
                        Enter your new password below.
                    </p>
                    
                    <form method="POST" action="{{ url_for('reset_password', token=token) }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                        <div class="mb-3">
                            <label for="password" class="form-label"><i class="fas fa-lock me-2"></i>New Password</label>
                            <div class="password-toggle-wrapper">
                                <input type="password" class="form-control" id="password" name="password" required minlength="8" autofocus>
                                <button type="button" class="password-toggle-icon" onclick="togglePassword('password')">
                                    <i class="fas fa-eye" id="toggle-password-icon"></i>
                                </button>
                            </div>
                            <small class="form-text text-muted">At least 8 characters with uppercase, lowercase, and numbers</small>
                        </div>
                        
                        <div class="mb-4">
                            <label for="confirm_password" class="form-label"><i class="fas fa-check-circle me-2"></i>Confirm New Password</label>
                            <div class="password-toggle-wrapper">
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password" required minlength="8">
                                <button type="button" class="password-toggle-icon" onclick="togglePassword('confirm_password')">
                                    <i class="fas fa-eye" id="toggle-confirm_password-icon"></i>
                                </button>
                            </div>
                        </div>
                        
                        <div class="d-grid">
                            <button type="submit" class="btn btn-reset btn-lg text-white">Reset Password</button>
                        </div>
                    </form>
                    
                    <div class="text-center mt-4">
                        <small>
                            <a href="{{ url_for('login') }}" class="auth-link"><i class="fas fa-arrow-left me-1"></i>Back to Login</a>
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function togglePassword(inputId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById('toggle-' + inputId + '-icon');
    
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
    }
}
</script>
{% endblock %}
