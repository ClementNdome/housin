{% extends 'base.html' %}

{% block title %}Change Password - Kitui Housing{% endblock %}

{% block extra_css %}
<style>
    .password-toggle-wrapper {
        position: relative;
    }
    .password-toggle-icon {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        color: #6c757d;
        z-index: 10;
        background: transparent;
        border: none;
        padding: 5px;
    }
    .password-toggle-icon:hover {
        color: #0d6efd;
    }
    .password-toggle-wrapper .form-control {
        padding-right: 45px;
    }
</style>
{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Change Password</h4>
                </div>
                <div class="card-body p-4">
                    <form method="POST" novalidate>
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                        
                        <div class="mb-3">
                            <label for="current_password" class="form-label">Current Password</label>
                            <div class="password-toggle-wrapper">
                                <input type="password" class="form-control" id="current_password" name="current_password" required>
                                <button type="button" class="password-toggle-icon" onclick="togglePassword('current_password')">
                                    <i class="fas fa-eye" id="toggle-current_password-icon"></i>
                                </button>
                            </div>
                            <small class="form-text text-muted">Enter your current password for verification</small>
                        </div>

                        <div class="mb-3">
                            <label for="new_password" class="form-label">New Password</label>
                            <div class="password-toggle-wrapper">
                                <input type="password" class="form-control" id="new_password" name="new_password" required>
                                <button type="button" class="password-toggle-icon" onclick="togglePassword('new_password')">
                                    <i class="fas fa-eye" id="toggle-new_password-icon"></i>
                                </button>
                            </div>
                            <small class="form-text text-muted">
                                At least 8 characters with uppercase, lowercase, and numbers
                            </small>
                        </div>

                        <div class="mb-3">
                            <label for="confirm_password" class="form-label">Confirm New Password</label>
                            <div class="password-toggle-wrapper">
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                                <button type="button" class="password-toggle-icon" onclick="togglePassword('confirm_password')">
                                    <i class="fas fa-eye" id="toggle-confirm_password-icon"></i>
                                </button>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Change Password</button>
                            <a href="{{ url_for('admin') }}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function togglePassword(inputId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById('toggle-' + inputId + '-icon');
    
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
    }
}
</script>
{% endblock %}
