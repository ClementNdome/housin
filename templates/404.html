{% extends 'base.html' %}

{% block title %}404 - Page Not Found{% endblock %}

{% block extra_css %}
<style>
    .error-page {
        min-height: calc(100vh - 200px);
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .error-content {
        text-align: center;
    }
    .error-code {
        font-size: 8rem;
        font-weight: 700;
        color: #1a4d47;
        line-height: 1;
    }
    .error-heading {
        color: #1a4d47;
        font-weight: 700;
        margin: 20px 0;
    }
    .btn-home {
        background-color: #1a4d47;
        color: white;
        border: none;
        padding: 12px 30px;
        font-weight: 600;
        transition: all 0.3s;
    }
    .btn-home:hover {
        background-color: #0f3330;
        color: white;
    }
</style>
{% endblock %}

{% block content %}
<div class="error-page container">
    <div class="error-content">
        <div class="error-code">404</div>
        <h2 class="error-heading"><i class="fas fa-search me-2"></i>Page Not Found</h2>
        <p class="lead text-muted mb-4">The page you're looking for doesn't exist or has been moved.</p>
        <a href="{{ url_for('dashboard') }}" class="btn btn-home btn-lg">
            <i class="fas fa-home me-2"></i>Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
